{% extends "base.html" %}{% block title %}Verify email{% endblock %}
{% block content %}<section class="wrap page narrow"><form class="panel form auth-card" method="post"><p class="eyebrow">EMAIL VERIFICATION</p><h1>Check your inbox</h1><p class="sub">Enter the six-digit code sent to <strong>{{ email }}</strong>. It expires in 10 minutes.</p><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Verification code<input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="one-time-code"></label><button class="btn btn-lg" type="submit">Verify email</button></form><form method="post" action="{{ url_for('resend_verification') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="btn btn-ghost" type="submit">Resend code</button></form><p class="muted">Codes expire after 10 minutes and resend requests have a 60-second cooldown.</p></section>{% endblock %}
